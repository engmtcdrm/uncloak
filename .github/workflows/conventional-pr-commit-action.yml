name: Conventional PR/Commit Action

on:
  workflow_call:

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: PR Conventional Commit Validation
        uses:  ytanikin/pr-conventional-commits@1.5.2
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert","build"]'
          add_label: 'false'
  validate-commits-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Validate Commit Messages
        uses: webiny/action-conventional-commits@v1.4.2
        with:
          allowed-commit-types: "feat,fix,docs,test,ci,refactor,perf,chore,revert,build"
